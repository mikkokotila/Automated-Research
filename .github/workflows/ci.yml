# Budgets (enforced by timeout-minutes, measured 2026-09-27):
#   smoke ~21s -> 3 min; matrix ~22s -> 5 min; docker cold ~2.5min / warm ~90s -> 8 min
# smoke runs on every push; matrix + docker run only on pull_request.
# Docs-only changes skip CI entirely (no test reads docs content; verified 2026-09-27).
name: ci
on:
  push:
    paths-ignore: ['docs/**', 'validation/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'validation/**', '**/*.md']
  schedule:
    - cron: "17 6 * * 1"  # weekly containment proof on main (Build 04)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh && python3 -m py_compile scripts/*.py && python3 scripts/check_dashboard_js.py
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: |
          uv run --no-sync python -c "import sys, platform; print(sys.version); print(platform.platform())"
          uv run --no-sync pytest -q -m "not live" --durations=10
  matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q -m "not live" --durations=10
  docker:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: canary:ci
          load: true
          cache-from: type=gha,scope=canary-main
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=canary-main' || '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: boundary/Dockerfile
          tags: canary-boundary:check
          load: true
          cache-from: type=gha,scope=canary-gate
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=canary-gate' || '' }}
      - run: ./scripts/container_verify.sh
        env:
          IMG: canary:ci
          CANARY_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule'
        with:
          name: containment-report
          path: containment-report.json
  guard:
    # External safety properties (Issue #63): runs from canary-guards, which
    # PRs to this repo cannot reach. Pinned to a full SHA (no floating tags).
    if: github.event_name == 'pull_request'
    uses: mikkokotila/canary-guards/.github/workflows/guard.yml@061c9b030e17eae67379f8b463c4188dfb688686
    with:
      repo: mikkokotila/Canary
      ref: ${{ github.event.pull_request.head.sha }}
