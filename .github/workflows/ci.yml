# Budgets (enforced by timeout-minutes, measured 2026-09-27):
#   smoke  ~25s -> 3 min    matrix ~25s each -> 5 min    docker ~40s cached -> 8 min
# smoke runs on every push; matrix + docker run only on pull_request.
name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: |
          uv run --no-sync python -c "import sys, platform; print(sys.version); print(platform.platform())"
          uv run --no-sync pytest -q --durations=10
  matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q --durations=10
      - run: uv run --no-sync pytest -q -m containment
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: canary:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: boundary/Dockerfile
          tags: canary-boundary:check
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./scripts/container_verify.sh
        env:
          IMG: canary:ci
          CANARY_PREBUILT: "1"
