[project]
name = "canary"
version = "0.1.0"
description = "Cited literature reviews and tabular analysis via Muse API."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "openai>=1.40", "pandas>=2.0", "scikit-learn>=1.3", "numpy>=1.24"]

[project.scripts]
canary = "canary.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live and not containment' --strict-markers"
markers = [
    "live: requires live provider credentials and network (opt-in only)",
    "containment: requires docker or host containment checks (opt-in only)",
]
