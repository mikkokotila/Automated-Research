[project]
name = "autoresearch"
version = "0.1.0"
description = "Automated researcher milestone 1: cited literature review via Muse API."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "openai>=1.40"]

[project.scripts]
autoresearch = "autoresearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
